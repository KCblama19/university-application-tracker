{% extends "base.html" %}

{% block content %}

<h1>{{ page_title }}</h1>

<form method="post">
    {% csrf_token %}

    {{ form.non_field_errors }}

    {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}">
                {{ field.label }}
            </label>

            {{ field }}

            {% if field.help_text %}
                <small>{{ field.help_text }}</small>
            {% endif %}

            {% for error in field.errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
    {% endfor %}

    <button type="submit">
        {{ submit_label }}
    </button>

    <a href="{% url 'universities:list' %}">
        Cancel
    </a>
</form>

{% endblock %}
